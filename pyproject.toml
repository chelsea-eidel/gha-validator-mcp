[project]
name = "gha-validator-mcp"
version = "0.1.0"
description = "An MCP server that validates GitHub Actions workflows for correctness and supply-chain safety."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chelsea E" }]
dependencies = [
    "mcp>=1.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gha-validator-mcp = "gha_validator_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gha_validator_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
