name: Validate Workflows
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/gha_validator_mcp/**"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Validate all workflows in this repo
        run: gha-validate --github
